name: Weekly Auto Commit

on:
  schedule:
    - cron: '0 0 * * 1,4'   # Monday and Thursday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make 5 commits
        run: |
          for i in $(seq 1 5); do
            echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") - auto commit $i/5" >> auto-commit-log.txt
            git add auto-commit-log.txt
            git commit -m "Auto commit $i/5 - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true
          done

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref_name }}

